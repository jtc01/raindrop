[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamctx"
version = "0.1.0"
description = "Share agent chat context across a team via an MCP server"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "questionary>=2",
    "httpx>=0.27",
    "fastmcp>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
teamctx = "teamctx.cli:main"

[tool.setuptools.packages.find]
include = ["teamctx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
