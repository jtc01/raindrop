[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raindrop-cli"
version = "0.1.0"
description = "Raindrop CLI: share coding-agent context with your team"
requires-python = ">=3.10"
dependencies = ["typer", "httpx"]

[project.scripts]
raindrop = "cli:app"

[tool.setuptools]
py-modules = ["cli", "api_client", "config", "redact", "sync_cmd", "tools_cmd"]

[tool.setuptools.packages.find]
include = ["teamctx*"]
