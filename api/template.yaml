AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: raindrop API (REST + MCP on one Lambda via Lambda Web Adapter)

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024

Resources:
  RaindropApi:
    Type: AWS::Serverless::HttpApi

  TeamsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: raindrop-teams
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: team_id, AttributeType: S }
      KeySchema:
        - { AttributeName: team_id, KeyType: HASH }

  JoinCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: raindrop-join-codes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: code_hash, AttributeType: S }
        - { AttributeName: team_id, AttributeType: S }
      KeySchema:
        - { AttributeName: code_hash, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: by_team
          KeySchema:
            - { AttributeName: team_id, KeyType: HASH }
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  AgentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: raindrop-agents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: key_hash, AttributeType: S }
        - { AttributeName: team_id, AttributeType: S }
      KeySchema:
        - { AttributeName: key_hash, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: by_team
          KeySchema:
            - { AttributeName: team_id, KeyType: HASH }
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [agent_id, display_name, focus, status, created_at]

  # Raw exchanges. The ingestion Lambda subscribes to ObjectCreated events on this bucket.
  ExchangesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub raindrop-exchanges-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RaindropFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Runtime: python3.12
      Architectures: [arm64]
      Handler: run.sh
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:27
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: 8080
          AWS_LWA_READINESS_CHECK_PATH: /health
          TEAMS_TABLE: !Ref TeamsTable
          JOIN_CODES_TABLE: !Ref JoinCodesTable
          AGENTS_TABLE: !Ref AgentsTable
          EXCHANGES_BUCKET: !Ref ExchangesBucket
          VECTOR_BUCKET_NAME: !Sub raindrop-vectors-${AWS::AccountId}
          VECTOR_INDEX_NAME: raindrop-exchanges
      Policies:
        - S3WritePolicy: { BucketName: !Ref ExchangesBucket }
        - S3ReadPolicy: { BucketName: !Ref ExchangesBucket }
        - Statement:
            - Sid: BedrockTitanEmbed
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
            - Sid: S3VectorsExchanges
              Effect: Allow
              Action:
                - s3vectors:PutVectors
                - s3vectors:QueryVectors
                - s3vectors:GetVectors
              Resource:
                - !Sub arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/raindrop-vectors-${AWS::AccountId}
                - !Sub arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/raindrop-vectors-${AWS::AccountId}/index/raindrop-exchanges
        - DynamoDBCrudPolicy: { TableName: !Ref TeamsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref JoinCodesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AgentsTable }
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref RaindropApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref RaindropApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Base URL for the raindrop API
    Value: !Sub https://${RaindropApi}.execute-api.${AWS::Region}.amazonaws.com
  ExchangesBucketName:
    Description: S3 bucket holding raw exchanges (ingestion reads from here)
    Value: !Ref ExchangesBucket
