[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raindrop-cli"
version = "0.1.0"
description = "Raindrop CLI: share coding-agent context with your team"
requires-python = ">=3.10"
dependencies = ["typer", "httpx", "fastmcp==4.1.6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
raindrop = "raindrop.cli:app"

[tool.setuptools.packages.find]
include = ["raindrop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
